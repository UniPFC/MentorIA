[project]
name = "MentorIA"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "alembic>=1.18.4",
    "bitsandbytes>=0.49.2",
    "fastapi>=0.129.2",
    "openai>=2.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.22",
    "python-gnupg>=0.5.2",
    "qdrant-client>=1.17.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.41.0",
    "pydantic[email]>=2.12.5",
    "einops>=0.8.2",
    "ipykernel>=7.2.0",
    "zxcvbn>=4.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",

    "faster-whisper>=1.2.1",
    "websockets>=16.0",
]

[tool.uv]
index = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP042", "E712", "E402", "F402", "F841", "N806", "F821", "E741"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "F401", "F403"]
"config/settings.py" = ["N802"]
"config/logger.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
strict_optional = true
explicit_package_bases = true
exclude = [
    "^alembic/",
    "^tests/"
]
