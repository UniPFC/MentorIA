name: Code Quality & Tests

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  lint:
    name: Lint & Type Check (Pre-commit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
    
    - name: Run Pre-commit Hooks (Format, Lint, Security, Mypy)
      run: |
        uvx pre-commit run --all-files

  test:
    name: Run Test Suite
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
    - uses: actions/checkout@v3

    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
    
    - name: Install dependencies with uv
      run: |
        uv sync
    
    - name: Load test environment variables
      run: |
        grep -v '^#' tests/.env.test | grep -v '^$' >> $GITHUB_ENV
    
    - name: Run Unit Tests with Coverage
      run: |
        . .venv/bin/activate
        pytest tests/unit/ -v --tb=short --cov=src --cov=shared --cov-append
    
    - name: Run Integration Tests
      run: |
        . .venv/bin/activate
        pytest tests/integration/ -v --tb=short --cov=src --cov=shared --cov-append
    
    - name: Run Regression Tests
      run: |
        . .venv/bin/activate
        pytest tests/regression/ -v --tb=short -m regression --cov=src --cov=shared --cov-append
    
    - name: Run Performance Tests
      run: |
        . .venv/bin/activate
        pytest tests/performance/ -v --tb=short -m performance --cov=src --cov=shared --cov-append
    
    - name: Generate Coverage Report
      run: |
        . .venv/bin/activate
        coverage report --show-missing
        coverage html
        coverage xml
    
    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Generate Coverage Badge
      run: |
        uv pip install setuptools coverage-badge
        .venv/bin/coverage-badge -o coverage.svg -f
    
    - name: Push Coverage Badge
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add coverage.svg
        git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
        git push
    
    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('coverage.xml', 'utf8');
          const match = coverage.match(/line-rate="([^"]+)"/);
          const lineRate = match ? (parseFloat(match[1]) * 100).toFixed(2) : 'N/A';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Test Results ✅\n\n- **Coverage:** ${lineRate}%\n- **Unit Tests:** ✅ Passed\n- **Integration Tests:** ✅ Passed\n- **Regression Tests:** ✅ Passed\n- **Performance Tests:** ✅ Passed\n\nAll tests passed successfully!`
          })
    
    - name: Fail if coverage below threshold
      run: |
        . .venv/bin/activate
        python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = float(root.get('line-rate', 0)) * 100
        print(f'Coverage: {coverage:.2f}%')
        if coverage < 90:
            print('ERROR: Coverage below 90% threshold')
            exit(1)
        "


  deploy_aws:
    name: Deploy Ephemeral AWS EC2
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Ensure Tag is on Main Branch
      run: |
        # Busca a branch main para garantir que a temos no historico local
        git fetch origin main
        # Verifica se o commit que disparou a tag pertence ao historico da main
        if ! git merge-base --is-ancestor ${{ github.sha }}^{commit} origin/main; then
          echo "ERROR: Esta Tag nao foi criada a partir da branch 'main'. Abortando o Deploy!"
          exit 1
        fi



    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Make deploy script executable
      run: chmod +x .github/workflows/scripts/deploy-ec2.sh
      
    - name: Run Deploy Script
      env:
        APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        APP_SYSTEM_EMAIL: ${{ secrets.APP_SYSTEM_EMAIL }}
        APP_SYSTEM_PASSWORD: ${{ secrets.APP_SYSTEM_PASSWORD }}
        APP_ADMIN_SLUG: ${{ secrets.APP_ADMIN_SLUG }}
        APP_BACKUP_PASSPHRASE: ${{ secrets.APP_BACKUP_PASSPHRASE }}
        APP_PASSWORD_PEPPER: ${{ secrets.APP_PASSWORD_PEPPER }}
        APP_ENCRYPTION_SALT: ${{ secrets.APP_ENCRYPTION_SALT }}
        APP_LLM_PROVIDER: ${{ secrets.APP_LLM_PROVIDER }}
        APP_LLM_MODEL: ${{ secrets.APP_LLM_MODEL }}
        APP_OPENAI_API_KEY: ${{ secrets.APP_OPENAI_API_KEY }}
        APP_GEMINI_API_KEY: ${{ secrets.APP_GEMINI_API_KEY }}
        APP_EMBEDDING_PROVIDER: ${{ secrets.APP_EMBEDDING_PROVIDER || 'remote' }}
        APP_EMBEDDING_REMOTE_MODEL: ${{ secrets.APP_EMBEDDING_REMOTE_MODEL || 'text-embedding-3-small' }}
        APP_EMBEDDING_DIMENSION: ${{ secrets.APP_EMBEDDING_DIMENSION || '1536' }}
        APP_SMTP_SERVER: ${{ secrets.APP_SMTP_SERVER }}
        APP_SMTP_PORT: ${{ secrets.APP_SMTP_PORT }}
        APP_SMTP_USERNAME: ${{ secrets.APP_SMTP_USERNAME }}
        APP_SMTP_PASSWORD: ${{ secrets.APP_SMTP_PASSWORD }}
        APP_FROM_EMAIL: ${{ secrets.APP_FROM_EMAIL }}
      run: .github/workflows/scripts/deploy-ec2.sh
